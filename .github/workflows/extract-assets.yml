name: Extract Product Assets
on:
  push:
    paths:
      - '.github/workflows/extract-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract assets from zip and clean up
        run: |
          if [ -f mgdtrading_site.zip ]; then
            unzip -o mgdtrading_site.zip "assets/*" -d .
            rm -f mgdtrading_site.zip assets/products/.gitkeep
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || (git commit -m "Extract 34 product images" && git push)
          fi
